# Alembic config for sift schema migrations.
# Run from repo root:
#   uv run alembic -c tools/db/alembic.ini upgrade head
# DSN: SIFT_PG_DSN (async or sync URL) or DATABASE_URL.

[alembic]
script_location = tools/db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

sqlalchemy.url = driver://user:pass@localhost/sift

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
