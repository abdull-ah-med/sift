[project]
name = "sift-api"
version = "0.0.0"
description = "sift HTTP API (FastAPI). Phase 0 scaffold only."
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sift-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift_api"]

[tool.uv.sources]
sift-core = { workspace = true }
