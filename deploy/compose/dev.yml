name: sift-dev

x-sift-env: &sift-env
  SIFT_PG_DSN: postgresql+asyncpg://sift:sift@postgres:5432/sift
  SIFT_VALKEY_URL: redis://valkey:6379/0
  SIFT_STORAGE_ENDPOINT: http://seaweedfs:8333
  SIFT_STORAGE_BUCKET: sift-uploads
  SIFT_STORAGE_ACCESS_KEY: sift
  SIFT_STORAGE_SECRET_KEY: sift-dev-secret
  SIFT_EMBED_URL: http://tei:80
  SIFT_RERANK_URL: http://tei-rerank:80

services:
  postgres:
    # ParadeDB tracks Postgres major; 18+ images expect the volume at
    # /var/lib/postgresql (not .../data) so pg_upgrade can use versioned dirs.
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
      POSTGRES_DB: sift
    ports:
      - "5432:5432"
    volumes:
      - sift-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: "server -s3 -s3.port=8333 -dir=/data -ip=seaweedfs"
    ports:
      - "8333:8333"
    volumes:
      - sift-seaweed:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  sift-api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      <<: *sift-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  sift-worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *sift-env
    depends_on:
      valkey:
        condition: service_healthy
    restart: "no"

  sift-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      # Host 3000 is commonly taken locally; map scaffold UI to 3001.
      - "3001:3000"
    depends_on:
      sift-api:
        condition: service_healthy

  # Optional ML / auth / tracing — enable with: --profile ml / --profile auth / --profile obs
  tei:
    profiles: ["ml"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: ["--model-id", "BAAI/bge-m3"]
    ports:
      - "8080:80"

  tei-rerank:
    profiles: ["ml"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "8081:80"

  zitadel:
    profiles: ["auth"]
    image: ghcr.io/zitadel/zitadel:latest
    command: start-from-init --masterkeyFromEnv
    environment:
      ZITADEL_MASTERKEY: "LocalDevMasterKeyMustBe32Bytes!!"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: sift
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: sift
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: sift
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: sift
      ZITADEL_EXTERNALSECURE: "false"
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy

  langfuse:
    profiles: ["obs"]
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://sift:sift@postgres:5432/langfuse
      NEXTAUTH_SECRET: local-dev-nextauth-secret
      SALT: local-dev-salt
      NEXTAUTH_URL: http://localhost:3100
      TELEMETRY_ENABLED: "false"
    ports:
      - "3100:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sift-pg:
  sift-seaweed:
