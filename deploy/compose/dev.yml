name: sift-dev

x-sift-env: &sift-env
  SIFT_PG_DSN: postgresql+asyncpg://sift:sift@postgres:5432/sift
  SIFT_VALKEY_URL: redis://valkey:6379/0
  SIFT_STORAGE_ENDPOINT: http://seaweedfs:8333
  SIFT_STORAGE_BUCKET: sift-uploads
  SIFT_STORAGE_ACCESS_KEY: sift
  SIFT_STORAGE_SECRET_KEY: sift-dev-secret
  SIFT_API_KEY_PEPPER: dev-pepper-change-me
  SIFT_OTEL_ENABLED: "false"
  SIFT_TUS_URL: http://tusd:8080/files/
  SIFT_ZITADEL_ISSUER: http://localhost:8085
  SIFT_ZITADEL_AUDIENCE: sift-web
  SIFT_TEI_URL: http://tei:80
  SIFT_TEI_RERANK_URL: http://tei-rerank:80
  SIFT_TEI_MODEL: BAAI/bge-m3
  SIFT_VECTOR_BACKEND: pgvector
  SIFT_QDRANT_URL: http://qdrant:6333

services:
  postgres:
    # ParadeDB tracks Postgres major; 18+ images expect the volume at
    # /var/lib/postgresql (not .../data) so pg_upgrade can use versioned dirs.
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
      POSTGRES_DB: sift
    ports:
      - "5432:5432"
    volumes:
      - sift-pg:/var/lib/postgresql
      - ./postgres/init-extra-dbs.sql:/docker-entrypoint-initdb.d/02-extra-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: "server -s3 -s3.port=8333 -dir=/data -ip=seaweedfs"
    ports:
      - "8333:8333"
    volumes:
      - sift-seaweed:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  tusd:
    image: tusproject/tusd:v2.8.0
    command:
      - "-port=8080"
      - "-base-path=/files/"
      - "-upload-dir=/srv/tusd-data"
      - "-behind-proxy"
    ports:
      - "1080:8080"
    volumes:
      - sift-tusd:/srv/tusd-data
    healthcheck:
      # tusd answers GET /files/ with 405; treat that as "listening".
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8080/files/ 2>&1 | grep -q '405 Method Not Allowed'"]
      interval: 5s
      timeout: 5s
      retries: 15

  sift-api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      <<: *sift-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  sift-worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *sift-env
    depends_on:
      valkey:
        condition: service_healthy
    restart: "no"

  sift-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      # Host 3000 is commonly taken locally; map scaffold UI to 3001.
      - "3001:3000"
    depends_on:
      sift-api:
        condition: service_healthy

  # Optional ML / auth / tracing — enable with: --profile ml / --profile auth / --profile obs
  # TEI CPU images are large; keep under profile `ml` so default `up` stays light.
  # Default image is digest-pinned linux/amd64 cpu-1.9. On Apple Silicon / aarch64 override
  # SIFT_TEI_IMAGE with the arm64 digest in deploy/compose/README.md (never *-latest).
  tei:
    profiles: ["ml"]
    image: ${SIFT_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48}
    # Laptop-safe batching; start_period covers first-time model download.
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--max-batch-tokens"
      - "16384"
    ports:
      - "8080:80"
    volumes:
      - sift-tei:/data
    environment:
      HF_HUB_CACHE: /data
      HUGGINGFACE_HUB_CACHE: /data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  tei-rerank:
    profiles: ["ml"]
    image: ${SIFT_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48}
    command:
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--max-batch-tokens"
      - "8192"
    ports:
      - "8081:80"
    volumes:
      - sift-tei-rerank:/data
    environment:
      HF_HUB_CACHE: /data
      HUGGINGFACE_HUB_CACHE: /data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  qdrant:
    profiles: ["ml"]
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - sift-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  zitadel-db:
    profiles: ["auth"]
    # Zitadel setup migrations are not yet compatible with ParadeDB/Postgres 18.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    volumes:
      - sift-zitadel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 10

  zitadel:
    profiles: ["auth"]
    image: ghcr.io/zitadel/zitadel:v2.71.8
    user: "0"
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: "LocalDevMasterKeyMustBe32Bytes!!"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8085"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: sift
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: sift-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "SiftAdmin1!"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: sift-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: sift-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /zitadel/bootstrap/machinekey.json
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    volumes:
      - ./zitadel-bootstrap:/zitadel/bootstrap
    ports:
      - "8085:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  langfuse:
    profiles: ["obs"]
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://sift:sift@postgres:5432/langfuse
      NEXTAUTH_SECRET: local-dev-nextauth-secret
      SALT: local-dev-salt
      NEXTAUTH_URL: http://localhost:3100
      TELEMETRY_ENABLED: "false"
    ports:
      - "3100:3000"
    depends_on:
      postgres:
        condition: service_healthy

  tempo:
    profiles: ["obs"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4318:4318"

volumes:
  sift-pg:
  sift-seaweed:
  sift-tusd:
  sift-zitadel-pg:
  sift-tei:
  sift-tei-rerank:
  sift-qdrant:
