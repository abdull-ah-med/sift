[project]
name = "sift"
version = "0.0.0"
description = "Privacy-first document intelligence, RAG, and agent knowledge base."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Abdullah Ahmed", email = "contactabdullahahmed@gmail.com" }]
dependencies = [
    "sift-core",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
]

[tool.uv.workspace]
members = [
    "libs/sift-core",
    "services/api",
    "services/worker",
    "apps/cli",
]

[tool.uv]
package = false

[tool.uv.sources]
sift-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C4", "PT", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services", "apps", "tests"]
pythonpath = ["."]
addopts = "-q"
