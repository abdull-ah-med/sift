[project]
name = "sift"
version = "0.0.0"
description = "Privacy-first document intelligence, RAG, and agent knowledge base."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Abdullah Ahmed", email = "contactabdullahahmed@gmail.com" }]
dependencies = [
    "sift-core",
    "sift-parse",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
    "alembic>=1.14",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
]

[tool.uv.workspace]
members = [
    "libs/sift-core",
    "libs/sift-parse",
    "libs/sift-ingest",
    "libs/sift-obs",
    "libs/sift-retrieve",
    "services/api",
    "services/worker",
    "apps/cli",
    "vendor/sift-parse/sift-parse",
    "vendor/sift-parse/sift-parse-core",
    "vendor/sift-parse/sift-parse-pdf",
    "vendor/sift-parse/sift-parse-models",
]

[tool.uv]
package = false

[tool.uv.sources]
sift-core = { workspace = true }
sift-parse = { workspace = true }
sift-retrieve = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sift", "sift_core", "sift_parse", "sift_ingest", "sift_retrieve", "sift_api", "sift_worker", "sift_cli"]

[tool.ruff.lint.per-file-ignores]
"services/api/src/sift_api/routes/*.py" = ["B008", "PLC0415"]
"services/api/src/sift_api/auth.py" = ["PLC0415"]
"services/api/src/sift_api/main.py" = ["PLC0415"]
"services/api/src/sift_api/audit_emit.py" = ["PLR0913"]
"services/api/src/sift_api/storage.py" = ["PLR0913"]
"services/api/src/sift_api/ingest.py" = ["PLR0913"]
"services/api/src/sift_api/ingest_parse.py" = ["PLR0913"]
"services/api/src/sift_api/routes/review.py" = ["B008", "PLC0415", "PLR0913"]
"services/api/src/sift_api/checkpointer.py" = ["PLC0415"]
"apps/cli/src/sift_cli/**/*.py" = ["B008"]
"libs/sift-parse/src/sift/parse/smoke.py" = ["PLC0415"]
"libs/sift-parse/src/sift/parse/_mapping.py" = ["PLR0911", "PLR0913", "PLR2004"]
"libs/sift-parse/tests/**/*.py" = ["PLC0415", "PLR2004", "E741"]
"services/api/tests/**/*.py" = ["PLR2004"]
"tools/db/seed/**/*.py" = ["E402"]
"tools/auth/**/*.py" = ["PLR2004"]
"tools/e2e/**/*.py" = ["PLR2004", "F401"]
"tools/models/prefetch.py" = ["B008"]
"tools/db/backfill_reparse.py" = ["PLR0913"]
"evals/**/*.py" = ["PLR2004"]
"tests/integration/test_review_api.py" = ["PLR2004"]
"tests/integration/test_review_langgraph.py" = ["PLR2004"]
"tests/integration/test_document_content.py" = ["PLR2004"]
"services/api/tests/test_review_graph_unit.py" = ["PLR2004"]
"libs/sift-ingest/src/sift_ingest/chunker.py" = ["PLR0913"]
"libs/sift-ingest/src/sift_ingest/equation_flags.py" = ["RUF001", "PLR0912", "PLR2004"]
"libs/sift-ingest/src/sift_ingest/quality_scorer.py" = ["PLW0603", "PLR2004", "PLC0415"]
"libs/sift-ingest/src/sift_ingest/semantic_boundary.py" = ["PLC0415", "PLR2004"]
"libs/sift-ingest/src/sift_ingest/utils/**/*.py" = ["PLR2004", "PLC0415", "E501"]
"libs/sift-parse/src/sift/parse/adapters/formula_ocr.py" = [
  "PLC0415",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PLW0603",
  "RUF001",
  "RUF012",
  "E501",
  "UP037",
  "UP045",
  "I001",
  "SIM114",
]
"libs/sift-ingest/tests/**/*.py" = ["PLR2004", "RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["vendor/"]

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "botocore.client",
    "sift_parse_core.*",
    "sift_parse.*",
    "sift_parse_pdf.*",
    "sift_parse_models.*",
    "fast_langdetect.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sift.parse.adapters.formula_ocr",
    "sift_ingest.utils.lang_detect",
    "sift_ingest.utils.rtl_detector",
    "sift_ingest.utils.ocr_router",
    "sift_ingest.semantic_boundary",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services", "apps", "tests"]
pythonpath = ["."]
addopts = "-q --ignore=vendor"
markers = [
    "slow: tests that need Docker / external services",
    "integration: needs external services or prefetched model weights",
]
