name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync
        # Install every workspace member so mypy/pytest see FastAPI, etc.
        run: uv sync --all-packages --group dev
      - name: Ruff
        run: |
          uv run ruff check libs services apps tests tools
          uv run ruff format --check libs services apps tests tools
      - name: Mypy
        run: uv run mypy libs/sift-core/src libs/sift-parse/src services/api/src
      - name: Pytest
        run: uv run pytest -q --ignore=vendor

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -r test
      - name: Typecheck
        run: pnpm -r typecheck
