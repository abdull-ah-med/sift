name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify vendored pdf_parsers hashes
        run: |
          set -euo pipefail
          DARWIN_SO=vendor/sift-parse/sift-parse-pdf/docling_parse/pdf_parsers.cpython-313-darwin.so
          LINUX_SO=vendor/sift-parse/sift-parse-pdf/docling_parse/pdf_parsers.cpython-313-x86_64-linux-gnu.so
          echo "68ed665a8a52a653f2bcff7753668be305eeb440bc6f65212db3e12a752c2f8b  ${DARWIN_SO}" | shasum -a 256 -c -
          echo "a704c4cb9c7cf9e55293655f33a989249a5e6b5acd3ac6a73cc50336f9b4ffa5  ${LINUX_SO}" | shasum -a 256 -c -
          WHEEL_URL='https://files.pythonhosted.org/packages/61/0e/0bc5b01967ad16c88766ffc72ac42e6deeeb160e734f1b7f383c746a082a/docling_parse-7.11.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl'
          WHEEL_SHA='94faec9b76e8c65c7e5aeeb20004aa9703fb78c3cf52bac2ee8dd155569f22e7'
          TMP=$(mktemp -d)
          curl -fsSL -o "${TMP}/wheel.whl" "${WHEEL_URL}"
          echo "${WHEEL_SHA}  ${TMP}/wheel.whl" | shasum -a 256 -c -
          python3 -c "import hashlib,zipfile,pathlib,sys; w=pathlib.Path('${TMP}/wheel.whl'); c=pathlib.Path('${LINUX_SO}'); z=zipfile.ZipFile(w); n=next(x for x in z.namelist() if x.endswith('pdf_parsers.cpython-313-x86_64-linux-gnu.so')); b=z.read(n); assert hashlib.sha256(b).hexdigest()=='a704c4cb9c7cf9e55293655f33a989249a5e6b5acd3ac6a73cc50336f9b4ffa5'; assert b==c.read_bytes(); print('pdf_parsers linux provenance ok')"
      - name: Sync
        # Install every workspace member so mypy/pytest see FastAPI, etc.
        run: uv sync --all-packages --group dev
      - name: Ruff
        run: |
          uv run ruff check libs services apps tests tools
          uv run ruff format --check libs services apps tests tools
      - name: Mypy
        run: uv run mypy libs/sift-core/src libs/sift-parse/src services/api/src
      - name: Engine DocumentConverter construct
        run: |
          uv run python -c "from sift_parse.document_converter import DocumentConverter; DocumentConverter(); print('DocumentConverter ok')"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sift-hf
          key: sift-parse-weights-${{ hashFiles('tools/models/prefetch.py') }}
          restore-keys: sift-parse-weights-
      - name: Prefetch parse model weights
        env:
          HF_HOME: ${{ runner.temp }}/sift-hf
        run: |
          uv run python tools/models/prefetch.py --dry-run
          uv run python tools/models/prefetch.py --cache-dir "$HF_HOME"
          echo "SIFT_HAVE_PARSE_WEIGHTS=1" >> "$GITHUB_ENV"
          echo "HF_HOME=$HF_HOME" >> "$GITHUB_ENV"
      - name: Pytest
        run: uv run pytest -q --ignore=vendor

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -r test
      - name: Typecheck
        run: pnpm -r typecheck

  preflight:
    name: Agent preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock expected local identity (CI contract)
        run: |
          git config --local user.name "Abdullah Ahmed"
          git config --local user.email "contactabdullahahmed@gmail.com"
          git config --local commit.gpgsign true
          git config --local tag.gpgsign true
      - name: Preflight
        env:
          SIFT_PREFLIGHT_CI: "1"
        run: python3 tools/agent/preflight.py
      - name: Verify commit authors on range
        run: |
          set -euo pipefail
          EXPECTED='Abdullah Ahmed <contactabdullahahmed@gmail.com>'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No base SHA; checking HEAD author only"
            author="$(git log -1 --format='%an <%ae>')"
            if [ "${author}" != "${EXPECTED}" ]; then
              echo "HEAD author mismatch: ${author}"
              exit 1
            fi
            exit 0
          fi
          bad="$(git log --format='%an <%ae>' "${BASE}"..HEAD | grep -v -F "${EXPECTED}" || true)"
          if [ -n "${bad}" ]; then
            echo "Non-locked authors found:"
            echo "${bad}"
            exit 1
          fi
          echo "All authors on ${BASE}..HEAD match locked identity"
