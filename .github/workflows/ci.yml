name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify vendored pdf_parsers hashes
        run: |
          echo "68ed665a8a52a653f2bcff7753668be305eeb440bc6f65212db3e12a752c2f8b  vendor/sift-parse/sift-parse-pdf/sift_parse_pdf/pdf_parsers.cpython-313-darwin.so" | shasum -a 256 -c -
          echo "a704c4cb9c7cf9e55293655f33a989249a5e6b5acd3ac6a73cc50336f9b4ffa5  vendor/sift-parse/sift-parse-pdf/sift_parse_pdf/pdf_parsers.cpython-313-x86_64-linux-gnu.so" | shasum -a 256 -c -
      - name: Sync
        # Install every workspace member so mypy/pytest see FastAPI, etc.
        run: uv sync --all-packages --group dev
      - name: Ruff
        run: |
          uv run ruff check libs services apps tests tools
          uv run ruff format --check libs services apps tests tools
      - name: Mypy
        run: uv run mypy libs/sift-core/src libs/sift-parse/src services/api/src
      - name: Engine DocumentConverter construct
        run: |
          uv run python -c "from sift_parse.document_converter import DocumentConverter; DocumentConverter(); print('DocumentConverter ok')"
      - name: Pytest
        run: uv run pytest -q --ignore=vendor

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -r test
      - name: Typecheck
        run: pnpm -r typecheck
