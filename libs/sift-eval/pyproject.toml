[project]
name = "sift-eval"
version = "0.0.0"
description = "Retrieval and RAG evaluation metrics for sift."
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift_eval"]

[tool.hatch.build.targets.wheel.sources]
"src/sift_eval" = "sift_eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
