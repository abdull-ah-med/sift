[project]
name = "sift-core"
version = "0.0.0"
description = "Shared types, IDs, errors, tenants, auth primitives, and settings for sift."
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "blake3>=1.0.9",
    "python-ulid>=3.0",
    "rfc8785>=0.1.4",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift_core"]

[tool.hatch.build.targets.wheel.sources]
"src/sift_core" = "sift_core"

[tool.pytest.ini_options]
testpaths = ["tests"]
