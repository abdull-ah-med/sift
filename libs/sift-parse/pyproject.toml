[project]
name = "sift-parse"
version = "0.0.0"
description = "Thin product adapter (`sift.parse`) over the vendored sift-parse engine."
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sift-core",
    "pydantic>=2.10",
    "pypdfium2>=5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.hatch.build.targets.wheel.sources]
"src/sift" = "sift"

[tool.uv.sources]
sift-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
