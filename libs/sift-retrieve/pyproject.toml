[project]
name = "sift-retrieve"
version = "0.0.0"
description = "Hybrid dense + BM25 retrieval, RRF, and rerank for sift."
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sift-core",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift_retrieve"]

[tool.hatch.build.targets.wheel.sources]
"src/sift_retrieve" = "sift_retrieve"

[tool.uv.sources]
sift-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
